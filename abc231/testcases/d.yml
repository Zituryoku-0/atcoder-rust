---
type: Batch
timelimit: ~
match: Lines

cases:
  - name: sample1
    in: |
      4 2
      1 3
      2 3
    out: |
      Yes
  - name: sample2
    in: |
      4 3
      1 4
      2 4
      3 4
    out: |
      No
  - name: sample3
    in: |
      100000 3
      1 2
      1 100000
      2 100000
    out: |
      No
  - name: sample4
    in: |
      100000 0
    out: |
      Yes

extend:
  - type: Text
    path: "./d"
    in: /in/*.txt
    out: /out/*.txt
