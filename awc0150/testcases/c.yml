---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 7
      3 3 5 1 3
    out: |
      5
  - name: sample2
    in: |
      4 5
      5 4 5 3
    out: |
      3
  - name: sample3
    in: |
      10 8
      2 5 2 8 5 1 8 3 2 7
    out: |
      8

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
